
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 260"
     width="900" height="260">

  <defs>
    <linearGradient id="space" x2="0" y2="1">
      <stop stop-color="#080d2b"/>
      <stop offset="1" stop-color="#251047"/>
    </linearGradient>
    <linearGradient id="planet" x2="1" y2="1">
      <stop stop-color="#ff9de2"/>
      <stop offset="1" stop-color="#6255db"/>
    </linearGradient>
  </defs>

  <rect width="900" height="260" fill="url(#space)"/>

  <!-- Estrelas piscando -->
  <g fill="#ffffff">
    <circle cx="70" cy="40" r="2">
      <animate attributeName="opacity"
        values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="100" r="2">
      <animate attributeName="opacity"
        values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="35" r="2">
      <animate attributeName="opacity"
        values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="70" r="2">
      <animate attributeName="opacity"
        values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="35" r="2">
      <animate attributeName="opacity"
        values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="180" r="1.5"/>
    <circle cx="430" cy="210" r="1.5"/>
    <circle cx="120" cy="200" r="1.5"/>
  </g>

  <!-- Planeta orbitando -->
  <ellipse cx="450" cy="120" rx="95" ry="35"
    fill="none" stroke="#8c70e8"
    stroke-dasharray="3 7" opacity="0.6"/>

  <g>
    <animateTransform attributeName="transform"
      type="rotate" from="0 450 120"
      to="360 450 120" dur="18s"
      repeatCount="indefinite"/>
    <circle cx="545" cy="120" r="15"
      fill="url(#planet)" stroke="#ffb6ef" stroke-width="2"/>
  </g>

  <!-- Estação espacial -->
  <g stroke="#8c9df5" stroke-width="2">
    <path d="M75 115 L160 115 L160 145 L75 145 Z"
      fill="#292c67"/>
    <path d="M25 108 L75 108 L75 152 L25 152 Z"
      fill="#20275a"/>
    <path d="M160 108 L210 108 L210 152 L160 152 Z"
      fill="#20275a"/>

    <path d="M25 130 H75 M50 108 V152"
      stroke="#76d9ff" stroke-width="1"/>
    <path d="M160 130 H210 M185 108 V152"
      stroke="#76d9ff" stroke-width="1"/>

    <rect x="95" y="90" width="45" height="25"
      rx="4" fill="#474a91"/>
    <rect x="103" y="97" width="8" height="8"
      fill="#ffe5a0" stroke="none"/>
    <rect x="117" y="97" width="8" height="8"
      fill="#ffe5a0" stroke="none"/>

    <path d="M117 90 V65 H128 V90"
      fill="#393a78"/>
    <circle cx="122" cy="62" r="4"
      fill="#ff8bd9" stroke="none"/>
  </g>

  <!-- Luzes da estação -->
  <g fill="#ffd99a">
    <circle cx="85" cy="130" r="3">
      <animate attributeName="opacity"
        values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="145" cy="130" r="3">
      <animate attributeName="opacity"
        values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="122" cy="78" r="2"/>
  </g>

  <!-- Identidade da estação -->
  <g font-family="Arial, sans-serif" fill="#ffffff">
    <text x="450" y="215" text-anchor="middle"
      font-size="19" font-weight="bold">
      ESTAÇÃO ESPACIAL DA LYNE
    </text>
    <text x="450" y="239" text-anchor="middle"
      font-size="12" fill="#c8b8ff">
      Explorando o universo, uma linha de código por vez.
    </text>
  </g>
</svg>
