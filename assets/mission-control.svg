
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="280" viewBox="0 0 900 280">

  <defs>
    <radialGradient id="background">
      <stop offset="0%" stop-color="#211c48"/>
      <stop offset="100%" stop-color="#080b18"/>
    </radialGradient>

    <radialGradient id="core">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#8be9fd"/>
      <stop offset="70%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo -->
  <rect width="900" height="280" rx="12"
        fill="url(#background)"/>

  <!-- Estrelas -->
  <g fill="#b8c7ff">
    <circle cx="75" cy="45" r="1.5"/>
    <circle cx="145" cy="210" r="2"/>
    <circle cx="250" cy="65" r="1.5"/>
    <circle cx="680" cy="45" r="2"/>
    <circle cx="780" cy="205" r="1.5"/>
    <circle cx="830" cy="85" r="2"/>
    <circle cx="730" cy="125" r="1"/>
    <circle cx="195" cy="145" r="1"/>
  </g>

  <!-- Linhas de interface -->
  <g fill="none" stroke="#8be9fd"
     stroke-width="1" opacity="0.5">
    <path d="M65 92 H205 L225 112"/>
    <path d="M695 92 H835 L850 107"/>
    <path d="M65 185 H185 L205 165"/>
    <path d="M715 185 H835"/>
  </g>

  <!-- Painéis laterais -->
  <g font-family="Arial, sans-serif"
     fill="#8be9fd" font-size="10">
    <text x="65" y="78">NÚCLEO CENTRAL</text>
    <text x="695" y="78">TELEMETRIA</text>
    <text x="65" y="203">STATUS: ATIVO</text>
    <text x="715" y="203">SISTEMA ONLINE</text>
  </g>

  <!-- Anéis externos -->
  <g transform="translate(450 128)"
     fill="none" stroke="#7c6af2">

    <circle r="92" stroke-dasharray="3 9"
            stroke-width="1.5">
      <animateTransform attributeName="transform"
        type="rotate" from="0" to="360"
        dur="28s" repeatCount="indefinite"/>
    </circle>

    <circle r="79" stroke="#8be9fd"
            stroke-dasharray="28 14 4 14"
            stroke-width="1.5">
      <animateTransform attributeName="transform"
        type="rotate" from="360" to="0"
        dur="18s" repeatCount="indefinite"/>
    </circle>

    <circle r="63" stroke="#c4b5fd"
            stroke-dasharray="2 6"
            stroke-width="2">
      <animateTransform attributeName="transform"
        type="rotate" from="0" to="360"
        dur="12s" repeatCount="indefinite"/>
    </circle>

    <circle r="48" stroke="#8be9fd"
            stroke-width="1" opacity="0.7"/>

    <!-- Marcas de calibração -->
    <g stroke="#8be9fd" stroke-width="2">
      <path d="M0 -101 V-91"/>
      <path d="M0 91 V101"/>
      <path d="M-101 0 H-91"/>
      <path d="M91 0 H101"/>
    </g>
  </g>

  <!-- Núcleo de energia -->
  <circle cx="450" cy="128" r="43"
          fill="url(#core)" opacity="0.85"
          filter="url(#glow)">
    <animate attributeName="opacity"
      values="0.65;1;0.65" dur="2.4s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="450" cy="128" r="19"
          fill="#8be9fd" opacity="0.18">
    <animate attributeName="r"
      values="17;23;17" dur="2.4s"
      repeatCount="indefinite"/>
  </circle>

  <circle cx="450" cy="128" r="7"
          fill="#ffffff" filter="url(#glow)"/>

  <!-- Indicadores laterais -->
  <g fill="#8be9fd">
    <circle cx="225" cy="112" r="3"/>
    <circle cx="675" cy="112" r="3"/>
    <circle cx="205" cy="165" r="3"/>
    <circle cx="715" cy="185" r="3"/>
  </g>

  <!-- Título -->
  <g font-family="Arial, sans-serif"
     text-anchor="middle">
    <text x="450" y="244" font-size="16"
          font-weight="bold" letter-spacing="3"
          fill="#c4b5fd">
      SISTEMA ONLINE
    </text>
    <text x="450" y="263" font-size="10"
          letter-spacing="1.5" fill="#8be9fd">
      
